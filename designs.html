*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0b0e}
body{font-family:system-ui,sans-serif;display:flex;flex-direction:column}
.picker{flex:none;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#0b0b0e;border-bottom:1px solid #222;z-index:50}
.picker button{flex:none;font:600 13px system-ui;padding:8px 13px;border-radius:999px;border:1px solid #333;background:#16161b;color:#ccc;cursor:pointer}
.picker button.on{background:#fff;color:#000;border-color:#fff}
.stage{flex:1;min-height:0;display:flex;justify-content:center;background:#0b0b0e}
.phone{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:var(--bf);font-size:15px;line-height:1.45;position:relative;overflow:hidden}
.scene{flex:none;height:var(--sh,96px);position:relative;overflow:hidden}
.scene svg{display:block;width:100%;height:100%}
.topbar{position:absolute;left:14px;right:14px;top:10px;display:flex;justify-content:space-between;align-items:center}
.spaces{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:var(--rpill);padding:3px;backdrop-filter:blur(6px)}
.spaces span{padding:6px 14px;border-radius:var(--rpill);color:var(--mu);font-size:13px;cursor:pointer}
.spaces span.on{background:var(--ac);color:var(--onac);font-weight:700}
.clock{color:var(--scenetx,var(--mu));font-size:12px;background:var(--glass);padding:4px 10px;border-radius:var(--rpill);border:1px solid var(--line)}
main{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 18px;position:relative}
h1{font:var(--hw,700) 24px/1.15 var(--hf);margin:0 0 12px;color:var(--hd)}
h3{font:var(--hw,700) 15px/1.2 var(--hf);margin:0 0 10px;color:var(--hd)}
.card{background:var(--paper);border:var(--bw,1px) solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.nav b{font:var(--hw,700) 17px var(--hf);color:var(--hd)}
.nav i{font-style:normal;border:var(--bw,1px) solid var(--line);border-radius:var(--rd);padding:3px 13px;color:var(--mu);background:var(--paper2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dh{text-align:center;color:var(--mu);font-size:12px}
.d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:var(--rd);background:var(--c0);color:var(--mu);font-size:15px;position:relative}
.d.e{background:none}
.d.w{background:var(--cw);color:var(--cwt);font-weight:700}
.d.p{background:var(--cp);color:var(--cpt);font-weight:700}
.d.v{background:var(--cv);color:var(--cvt)}
.d.k{background:var(--ck);color:var(--ckt);font-weight:700}
.d.z{background:var(--cz);color:var(--czt);font-weight:700}
.d.t::after{content:"";position:absolute;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--today)}
.d.sw::before{content:"⇄";position:absolute;top:1px;right:4px;font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px;color:var(--mu);justify-content:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--paper);border:var(--bw,1px) solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow)}
.stat small{display:block;color:var(--mu);font-size:11px;letter-spacing:.04em}
.stat b{font:var(--hw,700) 20px var(--hf);color:var(--hd)}
.bar{height:12px;background:var(--c0);border-radius:var(--rpill);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:var(--rpill)}
.row{display:flex;justify-content:space-between;color:var(--mu);font-size:12px}
.big{font:var(--hw,700) 22px/1.2 var(--hf);color:var(--hd);margin:0 0 2px}
.sub{color:var(--mu);font-size:14px}
.btn{display:block;width:100%;padding:14px;border-radius:var(--rb);border:var(--bw,1px) solid var(--ac);background:var(--ac);color:var(--onac);font:var(--bw2,700) 16px var(--bf);text-align:center;margin-top:12px;box-shadow:var(--btnsh,none);cursor:pointer}
.btn.s{background:var(--paper2);color:var(--tx);border-color:var(--line);margin-top:8px;box-shadow:none}
.task{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line2)}
.task:first-of-type{border-top:0}
.chk{width:24px;height:24px;border:2px solid var(--mu);border-radius:var(--rchk);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.chk.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.tag{font-size:11px;padding:1px 9px;border-radius:var(--rpill);background:var(--c0);color:var(--mu);margin-left:6px}
.acc{display:flex;justify-content:space-between;padding:13px 14px;background:var(--paper);border:var(--bw,1px) solid var(--line);border-radius:var(--r);margin-bottom:8px;color:var(--hd);font-weight:700;box-shadow:var(--shadow)}
.acc span{color:var(--mu);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.chip{padding:9px 14px;border-radius:var(--rpill);border:var(--bw,1px) solid var(--line);background:var(--c0);color:var(--tx);font-size:14px}
.chip.on{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:700}
.inp{display:flex;gap:8px}
.inp div{flex:1;padding:12px 14px;border-radius:var(--rb);border:var(--bw,1px) solid var(--line);background:var(--paper2);color:var(--mu)}
.inp b{padding:12px 16px;border-radius:var(--rb);background:var(--ac);color:var(--onac)}
.tabs{flex:none;display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--tabbg);border-top:var(--bw,1px) solid var(--line)}
.tabs span{flex:1;text-align:center;padding:11px 4px;color:var(--mu);font-size:13px;border-radius:var(--rpill);cursor:pointer}
.tabs span.on{background:var(--tabon);color:var(--tabontx);font-weight:700}
/* ===== THEMES ===== */

.phone[data-t=ghibli] .nav i{background:#fffaf0}
.phone[data-t=dusk]{--bg:linear-gradient(#1d2a4a 0,#2a4666 220px,#1f3550 100%);--paper:#27395bcc;--paper2:#1f2f4e;--line:#3b5380;--line2:#32476f;--tx:#f3ecd8;--mu:#a9b6d6;--hd:#ffd98e;--ac:#ffb454;--onac:#2a1d0a;--bf:NU,sans-serif;--hf:FR,serif;--hw:600;--r:22px;--rd:14px;--rb:16px;--rpill:999px;--rchk:50%;--shadow:0 8px 24px #0006;--glass:#1d2a4acc;--scenetx:#cfd8ef;--c0:#2d4268;--cw:#f2a94e;--cwt:#2a1d0a;--cp:#3a4f7a;--cpt:#ffd9a0;--cv:#2a3b5f;--cvt:#8fa0c8;--ck:#5ec4c0;--ckt:#06302f;--cz:#e0687a;--czt:#fff;--today:#fff3c4;--tabbg:#1a2745;--tabon:#34496f;--tabontx:#ffd98e;--sh:120px}
.phone[data-t=cozy]{--bg:#d9b779;--paper:#f7e3b5;--paper2:#ead099;--line:#8a5a2b;--line2:#d3b479;--tx:#4a2f14;--mu:#8a6a3d;--hd:#5a3410;--ac:#5aa83c;--onac:#fff;--bf:VT,monospace;--hf:PS,monospace;--hw:400;--r:4px;--rd:2px;--rb:4px;--rpill:3px;--rchk:2px;--bw:3px;--shadow:0 4px 0 #8a5a2b;--btnsh:0 4px 0 #3a7a22;--glass:#f7e3b5;--c0:#ecd49d;--cw:#5aa83c;--cwt:#fff;--cp:#e8c85a;--cpt:#5a3a10;--cv:#d5bd88;--cvt:#8a6a3d;--ck:#4a8fd0;--ckt:#fff;--cz:#c8483c;--czt:#fff;--today:#fff;--tabbg:#8a5a2b;--tabon:#f7e3b5;--tabontx:#4a2f14;--sh:96px}
.phone[data-t=cozy]{font-size:20px;line-height:1.1}
.phone[data-t=cozy] h1{font-size:16px;line-height:1.5}.phone[data-t=cozy] h3{font-size:11px;line-height:1.6}.phone[data-t=cozy] .nav b{font-size:12px}.phone[data-t=cozy] .big{font-size:13px;line-height:1.6}.phone[data-t=cozy] .stat b{font-size:13px}

.phone[data-t=cozy] .btn{font-size:20px}

<script>

const SC={

 cozy:`<svg viewBox="0 0 400 96" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges"><rect width="400" height="96" fill="#8ecbf2"/><rect x="330" y="14" width="24" height="24" fill="#ffe27a"/><g fill="#fff"><rect x="50" y="22" width="48" height="12"/><rect x="62" y="14" width="24" height="8"/><rect x="200" y="30" width="56" height="12"/><rect x="212" y="22" width="28" height="8"/></g><rect y="66" width="400" height="30" fill="#6fbf4a"/><rect y="78" width="400" height="18" fill="#5aa83c"/><g fill="#8a5a2b"><rect x="296" y="46" width="8" height="24"/></g><g fill="#3f8f2a"><rect x="284" y="30" width="32" height="20"/><rect x="290" y="22" width="20" height="8"/></g><g fill="#d97b3c"><rect x="100" y="56" width="30" height="22"/></g><rect x="96" y="50" width="38" height="6" fill="#a8452a"/><rect x="108" y="64" width="8" height="14" fill="#5a3410"/></svg>`,

 brutal:`<svg viewBox="0 0 400 90" preserveAspectRatio="xMidYMid slice"><rect width="400" height="90" fill="#fde047"/><rect y="86" width="400" height="4" fill="#111"/><circle cx="330" cy="44" r="26" fill="#fb7185" stroke="#111" stroke-width="4"/><path d="M60 80 L100 20 L140 80Z" fill="#60a5fa" stroke="#111" stroke-width="4"/><rect x="170" y="36" width="60" height="40" fill="#4ade80" stroke="#111" stroke-width="4"/></svg>`,
 aurora:`<svg viewBox="0 0 400 100" preserveAspectRatio="xMidYMid slice"><defs><filter id="bl"><feGaussianBlur stdDeviation="22"/></filter></defs><rect width="400" height="100" fill="#0f1330"/><g filter="url(#bl)"><circle cx="70" cy="30" r="50" fill="#6d5dfc"/><circle cx="220" cy="60" r="45" fill="#22d3ee"/><circle cx="350" cy="20" r="50" fill="#c084fc"/></g></svg>`,

};
const TABS=['agenda','vandaag','logboek','hoofd'];
let cur='ghibli',tab='agenda';
const d=(n,c)=>`<div class="d ${c||''}">${n}</div>`;
function cal(){const st={1:'w',2:'w',3:'w',4:'v',5:'v',6:'w',7:'w',8:'w',9:'w',10:'w',11:'v',12:'v',13:'w sw',14:'w',15:'w t',16:'p',17:'p',18:'k',19:'k',20:'p',21:'p',22:'p',23:'p',24:'z',25:'v',26:'v',27:'p',28:'p',29:'p',30:'p',31:'v'};
 let h='';['m','d','w','d','v','z','z'].forEach(x=>h+=`<div class="dh">${x}</div>`);for(let i=0;i<3;i++)h+='<div class="d e"></div>';for(let i=1;i<=31;i++)h+=d(i,st[i]);return h}
const SCREENS={
 agenda:()=>`<h1>Agenda</h1><div class="card"><div class="nav"><i>‹</i><b>Oktober 2026</b><i>›</i></div><div class="cal">${cal()}</div>
  <div class="legend"><span><i style="background:var(--cw)"></i>gewerkt</span><span><i style="background:var(--cp)"></i>gepland</span><span><i style="background:var(--cv)"></i>vrij</span><span><i style="background:var(--ck)"></i>vakantie</span><span><i style="background:var(--cz)"></i>ziek</span><span>⇄ geruild</span></div></div>
  <div class="stats"><div class="stat"><small>Deze week</small><b>24u</b></div><div class="stat"><small>Oktober</small><b>96u</b></div><div class="stat"><small>Verwacht</small><b>€2.4k</b></div></div>
  <div class="card"><h3>Weken</h3>${[['wk 41','5–11 okt',100,'40u'],['wk 42','12–18 okt',60,'24u'],['wk 43','19–25 okt',100,'40u']].map(w=>`<div class="task" style="gap:10px"><div style="width:64px"><b>${w[0]}</b><div class="sub" style="font-size:11px">${w[1]}</div></div><div class="bar" style="flex:1;margin:0"><i style="width:${w[2]}%"></i></div><b>${w[3]}</b></div>`).join('')}</div>`,
 vandaag:()=>`<h1>Donderdag 15 oktober</h1><div class="card"><div class="big">Je werkt tot 23:00</div><div class="sub">Het logboek komt straks.</div><div class="bar"><i style="width:38%"></i></div><div class="row"><span>14:30</span><span>nog 5 u 16 min</span><span>23:00</span></div><div class="btn">Logboek schrijven</div><div class="btn s">Dienst aanpassen</div></div>
  <div class="stats"><div class="stat"><small>Volgende</small><b>vr 16</b></div><div class="stat"><small>Open notities</small><b>3</b></div><div class="stat"><small>Logboeken</small><b>12</b></div></div>
  <div class="card"><h3>Voor vandaag</h3><div class="task"><span class="chk"></span><div>Tandarts bellen<span class="tag">bellen</span></div></div><div class="task"><span class="chk"></span><div>Rooster checken<span class="tag">vandaag</span></div></div><div class="task"><span class="chk on">✓</span><div style="opacity:.55;text-decoration:line-through">Brood kopen</div></div></div>`,
 logboek:()=>`<h1>Logboek</h1><div class="card"><div class="nav" style="margin:0"><i>‹</i><b>do 15 oktober</b><i>›</i></div><div class="chips" style="margin-top:12px"><span class="chip">↩ vorige keer</span><span class="chip">Rustige dag</span><span class="chip">Drukke dag</span></div></div>
  <div class="acc">Personeel<span>2 gekozen ▾</span></div><div class="card"><div class="chips"><span class="chip on">Iedereen top vanavond!</span><span class="chip on">4 man is erg weinig</span><span class="chip">5 man tussen 17:00 en 21:00</span></div></div>
  <div class="acc">Winkel<span>3 gekozen ▸</span></div><div class="acc">HACCP<span>leeg ▸</span></div><div class="acc">Diefstal<span>leeg ▸</span></div><div class="btn">Kopieer logboek</div>`,
 hoofd:()=>`<h1>Hoofd</h1><div class="card"><div class="inp"><div>Noteer iets…</div><b>+</b></div></div><div class="chips" style="margin-bottom:12px"><span class="chip on">alle</span><span class="chip">bellen</span><span class="chip">kopen</span></div>
  <div class="card"><h3>★ Focus</h3><div class="task"><span class="chk"></span><div>Tandarts bellen<span class="tag">bellen</span></div></div></div>
  <div class="card"><h3>Open · 3</h3><div class="task"><span class="chk"></span><div>Rooster checken<span class="tag">vandaag</span></div></div><div class="task"><span class="chk"></span><div>Cadeau kopen</div></div><div class="task"><span class="chk"></span><div>Papieren ophalen<span class="tag">za 17 okt</span></div></div></div>`
};
function draw(){
  const ph=document.getElementById('ph');ph.dataset.t=cur;
  document.getElementById('scsvg').innerHTML=SC[cur];
  document.getElementById('sc').style.height=cur==='dracula'?'56px':cur==='dusk'?'120px':cur==='ghibli'?'110px':'';
  document.getElementById('mn').innerHTML=SCREENS[tab]();document.getElementById('mn').scrollTop=0;
  document.getElementById('tb').innerHTML=TABS.map(t=>`<span class="${t===tab?'on':''}" onclick="tab='${t}';draw()">${t}</span>`).join('');
  document.querySelectorAll('#pk button').forEach(b=>b.classList.toggle('on',b.dataset.k===cur));
  try{history.replaceState(null,'','#'+cur)}catch(e){}
}
const pk=document.getElementById('pk');
Object.keys(NAMES).forEach(k=>{const b=document.createElement('button');b.dataset.k=k;b.textContent=NAMES[k][0];b.onclick=()=>{cur=k;draw()};pk.appendChild(b)});
if(NAMES[location.hash.slice(1)])cur=location.hash.slice(1);
draw();
</script></body></html>
